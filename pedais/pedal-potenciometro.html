<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedal APPS com KPM12J</title>
<style>
:root{--bg1:#f4f6f8;--bg2:#dfe3e8;--ink:#212529;--muted:#6c757d;--card:#ffffffee}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
background:radial-gradient(ellipse at 45% 38%,var(--bg1) 0%,var(--bg2) 78%,#cfd4da 100%)}
#stage,#ov,#labels{position:absolute;inset:0}
#title{z-index:0}#stage{z-index:1}#ov,#labels{z-index:2}#ui{z-index:3}
#ov{pointer-events:none;width:100%;height:100%}
#labels{pointer-events:none}
.ln{fill:none;stroke:#343a40;stroke-width:1.6}
.dt{stroke:#fff;stroke-width:2}
.lab{position:absolute;left:0;top:0;background:var(--card);border-left:4px solid #495057;padding:7px 12px 8px;border-radius:6px;
box-shadow:0 2px 10px rgba(0,0,0,.12);white-space:nowrap}
.lab b{display:block;font-size:17px;font-weight:700}
.lab span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
#title{position:absolute;left:34px;top:26px;pointer-events:none}
#title h1{margin:0;font-size:27px;letter-spacing:-.01em}
#title p{margin:4px 0 0;color:var(--muted);font-size:15px}
#ui{display:none;position:absolute;right:16px;top:16px;background:#fffffff2;border-radius:10px;padding:14px 16px;width:340px;box-shadow:0 4px 20px rgba(0,0,0,.15);font-size:14px}
#ui input[type=range]{width:100%}
#ui table{width:100%;border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums}
#ui th{font-weight:500;color:var(--muted);font-size:12px;text-align:right}
#ui td{text-align:right;padding:3px 0}#ui td:first-child{text-align:left}
#ui i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
#df{margin-top:6px;color:var(--muted);font-size:12.5px}
#side{position:absolute;inset:0;display:flex;background:#f8f9fa}
#side .panel{width:520px;padding:46px 40px 0 0;box-sizing:border-box}
#side svg{flex:none}
#side h1{font-size:28px;margin:0 0 10px}
#side .lead{font-size:16.5px;line-height:1.5;color:#343a40}
.card{background:#fff;border-left:5px solid;border-radius:8px;padding:12px 16px;margin:14px 0;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.card h3{margin:0 0 8px;font-size:18px}
.kv{display:flex;justify-content:space-between;font-size:15.5px;padding:3px 0;font-variant-numeric:tabular-nums}
.kv span{color:#495057}
.note{font-size:15px;line-height:1.5;color:#343a40}.muted{color:#868e96;font-size:14px}
@media (max-width:640px){#ui{left:16px;right:16px;width:auto;top:auto;bottom:16px}#title h1{font-size:20px}}
</style></head>
<body>
<div id="stage"></div>
<svg id="ov"></svg>
<div id="labels"></div>
<div id="title"><h1>Pedal do acelerador · APPS redundante com 2× KPM12J</h1><p>Ilustração conceitual · pedal em repouso · curso 20° · dimensões do sensor aproximadas</p></div>
<div id="ui">
  <div style="display:flex;justify-content:space-between"><b>Pedal</b><span id="pv"></span></div>
  <input id="sl" type="range" min="0" max="100" step="0.5" value="0">
  <label><input id="an" type="checkbox"> animar</label> &nbsp; <label><input id="lb" type="checkbox" checked> legendas</label>
  <table id="ro"></table><div id="df"></div>
  <div style="margin-top:8px;color:#868e96;font-size:12px">Arraste para girar · role para zoom · sinal com inclinação positiva (5 V)</div>
</div>
